<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>روز برنامه‌نویس مبارک</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0d1117;
            color: #58a6ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: #161b22;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(88, 166, 255, 0.2);
            border: 1px solid #30363d;
            max-width: 600px;
            width: 90%;
        }
        h1 {
            color: #f0f6fc;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .code-box {
            background: #010409;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #21262d;
            text-align: left;
            direction: ltr;
            font-size: 16px;
            color: #7ee787;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }
        .cursor {
            display: inline-block;
            width: 8px;
            height: 18px;
            background-color: #7ee787;
            margin-left: 5px;
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .note {
            margin-top: 20px;
            font-size: 13px;
            color: #8b949e;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>&lt; Code & Life /&gt;</h1>
        <div class="code-box">
            <span id="typed-text"></span><span class="cursor"></span>
        </div>
        <p class="note">روز برنامه‌نویس بر تمامی کدنویس‌های عزیز مبارک باد! 💻✨</p>
    </div>

    <!-- موزیک پس‌زمینه (استفاده از یک موزیک لایت و آرامش‌بخش مناسب برنامه‌نویسی) -->
    <audio id="bg-music" loop>
        <source src="https://actions.google.com/sounds/v1/ambiences/computer_processing_loop.ogg" type="audio/ogg">
        تلفن همراه شما از صوت پشتیبانی نمی‌کند.
    </audio>

    <script>
        // متن دلخواهی که می‌خواهید با افکت تایپ نمایش داده شود
        const textToType = "print('Hello World! Happy Programmer\'s Day!')";
        let index = 0;
        const speed = 100; // سرعت تایپ به میلی‌ثانیه

        function typeWriter() {
            if (index < textToType.length) {
                document.getElementById("typed-text").innerHTML += textToType.charAt(index);
                index++;
                setTimeout(typeWriter, speed);
            }
        }

        // پخش موزیک و شروع تایپ به محض اولین کلیک یا تعامل کاربر با صفحه (به دلیل محدودیت مرورگرها برای اتوپلی)
        window.addEventListener('click', () => {
            const music = document.getElementById('bg-music');
            if (music.paused) {
                music.play().catch(e => console.log(e));
            }
        }, { once: true });

        // شروع افکت تایپ به محض لود صفحه
        window.onload = function() {
            setTimeout(typeWriter, 500);
            // تلاش برای پخش خودکار موزیک
            const music = document.getElementById('bg-music');
            music.play().catch(() => {
                // اگر مرورگر بلاک کرد، با اولین کلیک کاربر در صفحه پخش می‌شود
                console.log("Audio waiting for user interaction.");
            });
        };
    </script>

</body>
</html>
